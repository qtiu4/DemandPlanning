[theme.dark]
primaryColor = "#F43F5E"
backgroundColor = "#0E1437"
secondaryBackgroundColor = "#151C4B"
textColor = "#E6E9F5"

[theme.sidebar]
backgroundColor = "#0A0F2C"
secondaryBackgroundColor = "#151C4B"
textColor = "#E6E9F5"

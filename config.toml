# ธีมเข้มเสมอ — กำหนดทั้งโหมดสว่างและโหมดมืดเป็นสีเดียวกัน
# ผู้ใช้จะตั้งเครื่อง/เบราว์เซอร์เป็น Light, Dark หรือ System ก็เห็นหน้าตาเหมือนกัน
[theme]
base = "dark"
primaryColor = "#F43F5E"
backgroundColor = "#0E1437"
secondaryBackgroundColor = "#151C4B"
